services:
  - type: web
    name: code-notebook
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: READ_ONLY_DEMO
        value: "true"
      - key: VITE_READ_ONLY_DEMO
        value: "true"
